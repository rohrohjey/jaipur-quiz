<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wall 7 — Jaipur & the World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #e8ddd0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px 48px;
      font-family: 'Inter', sans-serif;
    }
    .app {
      background: #F2E8D9;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 8px 40px rgba(60,20,20,0.13);
    }
    .jali-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
    }
    .header {
      background: #6B1E2E;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }
    .museum-name {
      font-family: 'Cormorant Garamond', serif;
      color: #F2E8D9;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.7;
      font-weight: 400;
      margin-bottom: 3px;
    }
    .exhibit-name {
      font-family: 'Cormorant Garamond', serif;
      color: #F2E8D9;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .q-badge {
      font-size: 11px;
      color: #C9A84C;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: right;
      white-space: nowrap;
    }
    .question-card {
      background: #fff9f3;
      border-radius: 14px;
      border: 0.5px solid rgba(107,30,46,0.14);
      margin: 22px 18px 0;
      padding: 20px 20px 18px;
      position: relative;
      z-index: 1;
    }
    .eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #C9A84C;
      margin-bottom: 10px;
    }
    .question-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      font-weight: 600;
      color: #3A1018;
      line-height: 1.38;
    }
    .options {
      margin: 14px 18px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      z-index: 1;
    }
    .option-btn {
      background: #fff9f3;
      border: 1px solid rgba(107,30,46,0.18);
      border-radius: 10px;
      padding: 13px 14px;
      text-align: left;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #3A1018;
      font-weight: 400;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s, background 0.15s;
      width: 100%;
    }
    .option-btn:hover:not(:disabled) { border-color: #6B1E2E; background: #fdf0e6; }
    .option-btn:disabled { cursor: default; }
    .result-bar {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      border-radius: 10px;
      width: 0%;
      transition: width 0.65s cubic-bezier(0.4,0,0.2,1);
    }
    .option-inner {
      display: flex;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .letter {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(107,30,46,0.09);
      color: #6B1E2E;
      font-size: 11px;
      font-weight: 500;
      text-align: center;
      line-height: 22px;
      margin-right: 10px;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }
    .opt-label { flex: 1; }
    .correct-mark {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #2C5545;
      margin-left: 8px;
      opacity: 0;
      transition: opacity 0.3s 0.5s;
      white-space: nowrap;
    }
    .pct {
      font-size: 13px;
      font-weight: 500;
      color: #3A1018;
      margin-left: 8px;
      min-width: 34px;
      text-align: right;
      opacity: 0;
      transition: opacity 0.3s 0.45s;
    }
    .is-correct { border-color: #2C5545 !important; }
    .is-correct .result-bar { background: rgba(44,85,69,0.17); }
    .is-correct .letter { background: #2C5545; color: #fff; }
    .is-wrong { border-color: #6B1E2E !important; }
    .is-wrong .result-bar { background: rgba(107,30,46,0.12); }
    .is-other .result-bar { background: rgba(107,30,46,0.07); }
    .revealed .pct { opacity: 1; }
    .revealed .correct-mark { opacity: 1; }
    .feedback-wrap {
      margin: 14px 18px 0;
      position: relative;
      z-index: 1;
    }
    .feedback-box {
      border-radius: 10px;
      padding: 13px 16px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      line-height: 1.45;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.4s 0.3s, transform 0.4s 0.3s;
      display: none;
    }
    .feedback-box.show { opacity: 1; transform: translateY(0); display: block; }
    .feedback-box.right { background: #2C5545; color: #F2E8D9; }
    .feedback-box.wrong { background: #6B1E2E; color: #F2E8D9; }
    .footer {
      margin: 14px 18px 24px;
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 12px;
      color: rgba(107,30,46,0.45);
      font-family: 'Cormorant Garamond', serif;
      letter-spacing: 0.06em;
      opacity: 0;
      transition: opacity 0.3s 0.7s;
    }
    .footer.show { opacity: 1; }
    @media (max-width: 400px) {
      body { padding: 0; }
      .app { border-radius: 0; min-height: 100vh; }
    }
  </style>
</head>
<body>
<div class="app">
  <svg class="jali-bg" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <pattern id="jali" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
        <circle cx="20" cy="20" r="3" fill="none" stroke="#6B1E2E" stroke-width="1"/>
        <circle cx="20" cy="20" r="8" fill="none" stroke="#6B1E2E" stroke-width="0.7"/>
        <line x1="0" y1="20" x2="12" y2="20" stroke="#6B1E2E" stroke-width="0.5"/>
        <line x1="28" y1="20" x2="40" y2="20" stroke="#6B1E2E" stroke-width="0.5"/>
        <line x1="20" y1="0" x2="20" y2="12" stroke="#6B1E2E" stroke-width="0.5"/>
        <line x1="20" y1="28" x2="20" y2="40" stroke="#6B1E2E" stroke-width="0.5"/>
        <line x1="0" y1="0" x2="11.7" y2="11.7" stroke="#6B1E2E" stroke-width="0.4"/>
        <line x1="28.3" y1="28.3" x2="40" y2="40" stroke="#6B1E2E" stroke-width="0.4"/>
        <line x1="40" y1="0" x2="28.3" y2="11.7" stroke="#6B1E2E" stroke-width="0.4"/>
        <line x1="11.7" y1="28.3" x2="0" y2="40" stroke="#6B1E2E" stroke-width="0.4"/>
      </pattern>
    </defs>
    <rect width="400" height="600" fill="url(#jali)"/>
  </svg>

  <div class="header">
    <div>
      <div class="museum-name">City Palace Museum · Jaipur</div>
      <div class="exhibit-name">Jaipur &amp; the World</div>
    </div>
    <div class="q-badge">Wall 7</div>
  </div>

  <div class="question-card">
    <div class="eyebrow">Did You Know?</div>
    <div class="question-text">The Jantar Mantar observatory in Jaipur, built by Sawai Jai Singh II, was recognised by UNESCO as a World Heritage Site in which year?</div>
  </div>

  <div class="options" id="options"></div>

  <div class="feedback-wrap">
    <div class="feedback-box" id="feedback"></div>
  </div>

  <div class="footer" id="footer">City Palace Museum &nbsp;·&nbsp; Jaipur &amp; the World</div>
</div>

<script>
  const data = {
    opts: ["1998", "2003", "2010", "2016"],
    correct: 2,
    votes: [12, 25, 48, 15],
    fact: "Jantar Mantar was inscribed as a UNESCO World Heritage Site in 2010, celebrated for its nineteen remarkable architectural astronomical instruments."
  };

  const letters = ['A','B','C','D'];
  let answered = false;

  const wrap = document.getElementById('options');
  data.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML =
      '<div class="result-bar"></div>' +
      '<div class="option-inner">' +
        '<span class="letter">' + letters[i] + '</span>' +
        '<span class="opt-label">' + opt + '</span>' +
        (i === data.correct ? '<span class="correct-mark" id="cm-' + i + '">✓ Correct</span>' : '') +
        '<span class="pct" id="pct-' + i + '"></span>' +
      '</div>';
    btn.onclick = () => pick(i);
    wrap.appendChild(btn);
  });

  function pick(chosen) {
    if (answered) return;
    answered = true;

    // increment locally
    data.votes[chosen] += 1;
    const total = data.votes.reduce((a, b) => a + b, 0);

    const btns = document.querySelectorAll('.option-btn');
    btns.forEach((btn, i) => {
      btn.disabled = true;
      if (i === data.correct) btn.classList.add('is-correct');
      else if (i === chosen) btn.classList.add('is-wrong');
      else btn.classList.add('is-other');
      btn.classList.add('revealed');

      const pct = Math.round(data.votes[i] / total * 100);
      document.getElementById('pct-' + i).textContent = pct + '%';
      setTimeout(() => {
        btn.querySelector('.result-bar').style.width = pct + '%';
      }, 80);
    });

    const fb = document.getElementById('feedback');
    fb.textContent = (chosen === data.correct ? '✓  ' : 'Not quite — ') + data.fact;
    fb.className = 'feedback-box show ' + (chosen === data.correct ? 'right' : 'wrong');

    setTimeout(() => document.getElementById('footer').classList.add('show'), 700);
  }
</script>
</body>
</html>
